# Runs on GitHub-hosted runners (ubuntu-latest) — this job never touches a
# live database, so it never needs your own machine and is safe to run on
# any pull request, including ones from forks if this repo ever goes public.
#
# Place this file at .github/workflows/validate.yml in the DB-Platform repo
# (NOT in this gui/ subfolder — GitHub only reads workflows from that exact
# path at the repo root).
name: Validate database request

on:
  pull_request:
    paths:
      - "requests/**"

permissions:
  contents: read
  pull-requests: write # to post the results comment
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base branch history to diff changed files

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DB-Platform
        run: python -m pip install -e ".[dev]"

      - name: Find changed request files
        id: changed
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          files=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}"...HEAD -- 'requests/*.yaml' 'requests/*.yml')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run policy validation and readiness scoring
        id: run
        run: |
          set +e
          overall=0
          {
            echo "## DB-Platform request check"
            echo
          } > report.md
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "### \`$f\`" >> report.md
            echo '```' >> report.md
            dbre request validate "$f" >> report.md 2>&1
            v=$?
            dbre readiness assess "$f" >> report.md 2>&1
            r=$?
            echo '```' >> report.md
            if [ $v -ne 0 ] || [ $r -ne 0 ]; then overall=1; fi
          done <<< "${{ steps.changed.outputs.files }}"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post results as a PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail the check if policy or readiness failed
        if: steps.run.outputs.overall == '1'
        run: |
          echo "Policy validation or readiness scoring failed — see the PR comment above."
          exit 1
