name: Security

# A dedicated security pipeline, separate from functional CI, per the
# platform requirement that every PR be checked for secrets, vulnerable
# dependencies, insecure Python patterns, and insecure Terraform --
# see SECURITY.md for what each of these catches and why.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Dependency advisories are published continuously, not just when
    # this repo's code changes -- catch a newly-disclosed CVE in an
    # already-merged dependency within a week, not never.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the latest commit

      # gitleaks/gitleaks-action computes its scan range from the push
      # event's before/after commit SHAs. That range breaks -- "unknown
      # revision or path not in the working tree" -- the first time a
      # force-push or history rewrite (e.g. rebasing out an accidentally
      # committed secret) makes the "before" SHA unreachable from the new
      # history. Running the CLI directly against the full checked-out
      # history (fetch-depth: 0, above) sidesteps that range entirely, so
      # this job can't be broken by the exact kind of history rewrite it
      # exists to help clean up after.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          sudo tar xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz

      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v --report-format sarif --report-path results.sarif

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency vulnerability scanning (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install the project (so pip-audit resolves real pinned versions)
        run: pip install -e ".[aws,dev]"

      - name: Audit installed dependencies
        # --skip-editable: dbre-platform itself is installed editable (-e)
        # above and isn't published to PyPI, so pip-audit can't look it up
        # and fails the whole run with "Dependency not found on PyPI" --
        # this flag tells it to audit the third-party dependencies only,
        # which is what this check is actually for.
        run: pip-audit --strict --skip-editable

  static-analysis:
    name: Python static security analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install "bandit[toml]"

      - name: Run bandit
        run: bandit -r src/dbre_platform -c pyproject.toml

  terraform-security-scan:
    name: Terraform security scanning (tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

  pre-commit-hooks:
    name: Run the same hooks pre-commit enforces locally
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The terraform_fmt/terraform_validate hooks below shell out to a
      # `terraform` binary. ci.yml's terraform-validate job installs one
      # for the same reason; without it here, "validate" fails outright
      # with "Neither Terraform nor OpenTofu binary could be found" before
      # it ever gets to check anything.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - uses: pre-commit/action@v3.0.1
