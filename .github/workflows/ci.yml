name: CI

# Runs on every pull request and on pushes to main: the same checks
# documented in CONTRIBUTING.md and wrapped by the Makefile, so a
# contributor sees identical results locally and in CI.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint, format check, type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev tooling
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src/ tests/ automation/

      - name: ruff format --check
        run: ruff format --check src/ tests/ automation/

      - name: mypy
        run: mypy src/dbre_platform

  unit-and-policy-tests:
    name: Unit, policy, and readiness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev tooling
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: python -m unittest discover -s tests/unit -v

      - name: Validate every example request against policy
        run: |
          for f in examples/requests/*.yaml; do
            echo "--- $f ---"
            dbre request validate "$f" || true
          done

      - name: Confirm generated schema matches the Pydantic models
        run: |
          python automation/generate_schema.py
          git diff --exit-code schemas/database-request.schema.json || \
            (echo "::error::schemas/database-request.schema.json is stale -- run 'make schema' and commit the result" && exit 1)

  integration-tests-live-postgres:
    name: Integration tests against a live PostgreSQL service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install package with dev tooling
        run: pip install -e ".[dev]"

      - name: Run full suite including live-database tests
        env:
          DBRE_TEST_PG_HOST: 127.0.0.1
          DBRE_TEST_PG_PORT: "5432"
          DBRE_TEST_PG_USER: postgres
          DBRE_TEST_PG_PASSWORD: postgres
          DBRE_TEST_PG_DBNAME: postgres
        run: python -m unittest discover -s tests/unit -v

  terraform-validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform/

      - name: terraform validate (module)
        working-directory: terraform/modules/rds_postgresql
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform validate (dev environment)
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform validate (prod environment)
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate
