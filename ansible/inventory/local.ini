; Minimal local inventory for running the postgres_standards playbook
; against a database reachable from the Ansible control node itself
; (e.g. the docker-compose local demo, or any dev PostgreSQL server).
; connection=local means Ansible runs the postgresql_* modules directly
; on the control node rather than SSHing anywhere -- appropriate since
; those modules just need Python + psycopg to reach Postgres over the
; network, not shell access to the database host itself.
[postgres_targets]
localhost ansible_connection=local
