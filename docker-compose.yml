# Local demo environment: a single PostgreSQL instance the DBRE CLI
# provisions against, standing in for AWS RDS in local mode.
#
# Deliberately minimal: no init scripts create databases, roles, or
# extensions here. That is the platform's job (see
# dbre_platform.provisioning.local_docker), not docker-compose's -- the
# whole point of this project is that DBRE standards get applied by the
# platform, not baked silently into a container image. The `command:`
# section is overridden per-request at `.dbre/docker-compose.override.yml`
# (generated automatically) to reflect that request's cluster-level GUCs
# (see dbre_platform.postgres.standards.build_cluster_parameters).
#
# Run via the CLI, not directly: `dbre provision examples/requests/dev-app.yaml`
# (or `make demo`). Requires network access to pull postgres:16 the first
# time. See docs/local-vs-aws.md for exactly what differs from AWS RDS.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set via .dbre/local-superuser.env, generated by the CLI on first run}"
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - dbre_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: PostgreSQL for the Change Risk Engine's OWN metadata store
  # (change_risk_engine.persistence.postgres_store.PostgresAssessmentStore) --
  # a completely different database from `postgres` above (which the
  # dbre_platform provisioning flow administers) and different again from
  # whatever database CRE_DB_* points CRE at to *analyze*. The demo/tests
  # default to the dependency-free FileAssessmentStore instead; bring this
  # up only if you want to exercise the real Postgres-backed store:
  #   docker compose --profile cre up -d cre_store
  #   psql -h localhost -p 5433 -U postgres -f src/change_risk_engine/persistence/migrations/0001_init.sql
  cre_store:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${CRE_STORE_PG_PASSWORD:-change-me}"
      POSTGRES_DB: change_risk_engine
    ports:
      - "5433:5432"
    volumes:
      - cre_store_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - cre

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    profiles:
      - observability

volumes:
  dbre_platform_pgdata:
  cre_store_pgdata:
