[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbre-platform"
version = "0.1.0"
description = "A self-service PostgreSQL database platform: DBRE standards, policy-as-code, and operational readiness, built as a Platform Engineering reference implementation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rebecca Herrera" }]
keywords = [
    "dbre",
    "platform-engineering",
    "postgresql",
    "sre",
    "terraform",
    "kubernetes",
    "k3s",
    "cloudnative-pg",
    "policy-as-code",
]

# Core dependencies are intentionally minimal and dependency-light.
# The platform shells out to `psql`, `pg_dump`, `pg_restore`, `docker`, and
# `terraform` rather than embedding a native DB driver or an AWS SDK in the
# core path -- see docs/decisions/0002-psql-subprocess-over-driver.md.
dependencies = [
    "click>=8.1",
    "pydantic>=2.4",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "bandit>=1.7",
    "types-PyYAML",
]

[project.scripts]
dbre = "dbre_platform.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbre_platform = ["postgres/templates/*.sql.j2"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
# types-PyYAML (an optional [dev] dependency) provides real stubs; when it
# isn't installed, suppress the resulting import-untyped noise rather than
# letting one missing stub package fail CI for a well-known, stable library.
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests", "terraform", ".venv"]
